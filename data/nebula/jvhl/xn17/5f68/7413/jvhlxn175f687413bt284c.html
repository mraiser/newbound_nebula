<div class="nbdlg">
  <div class="nbdlg-head">
    <span class="nbdlg-title">Add member</span>
    <button class="nbdlg-x closememberbutton" title="Close">&#10005;</button>
  </div>
  <div class="nbdlg-body">
    <div class="memberpeerselector"></div>
    <label><span class="lbl">private ip</span><input type="text" id="memberipaddress" placeholder="Its address on this overlay"></label>
    <label><span class="lbl">groups</span><input type="text" id="membergroups" placeholder="Comma separated, no spaces (optional)"></label>
    <div class="nb-hint">A certificate is signed on this instance and delivered to the
      selected peer over the encrypted peer channel; the peer joins immediately.</div>
    <div class="nbdlg-err" hidden></div>
  </div>
  <div class="nbdlg-foot">
    <button class="btn cancelmemberbutton">Cancel</button>
    <button class="btn btn-primary createnewmemberbutton">Sign &amp; deliver</button>
  </div>
</div>

<div class="nbdlg">
  <div class="nbdlg-head">
    <span class="nbdlg-title">New network</span>
    <button class="nbdlg-x closenwbutton" title="Close">&#10005;</button>
  </div>
  <div class="nbdlg-body">
    <label><span class="lbl">name</span><input type="text" id="nwname" placeholder="Network name"></label>
    <label><span class="lbl">subnet prefix</span><input type="text" id="nwsubnet" placeholder="Example: 192.168.100.X/24"></label>
    <label><span class="lbl">port</span><input type="number" id="nwport" placeholder="UDP port"></label>
    <div class="nbdlg-err" hidden></div>
  </div>
  <div class="nbdlg-foot">
    <button class="btn cancelbutton">Cancel</button>
    <button class="btn btn-primary createnewnetworkbutton">Create network</button>
  </div>
</div>

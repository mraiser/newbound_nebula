<div class="nbdlg">
  <div class="nbdlg-head">
    <span class="nbdlg-title">Lighthouse</span>
    <button class="nbdlg-x closelhbutton" title="Close">&#10005;</button>
  </div>
  <div class="nbdlg-body">
    <div class="lighthousepeerselector"></div>
    <label><span class="lbl">private ip</span><input type="text" id="lhprivateip" placeholder="Its address on this overlay"></label>
    <label><span class="lbl">public ip</span><input type="text" id="lhpublicip" placeholder="Its reachable internet address"></label>
    <label><span class="lbl">port</span><input type="number" id="lhport" placeholder="Its nebula UDP port"></label>
    <div class="nbdlg-err" hidden></div>
  </div>
  <div class="nbdlg-foot">
    <button class="btn cancellhbutton">Cancel</button>
    <button class="btn btn-primary savelhbutton">Save lighthouse</button>
  </div>
</div>
